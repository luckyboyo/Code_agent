# Reviewer Golden Dataset
# 用真实存在的文件作为评审目标，并通过 relevant_files 明确限定检查范围。

- name: "审查通过-共享状态定义"
  input: "只审查 code_agent/state.py 的代码正确性和明显安全问题；若没有阻塞问题则通过。"
  context:
    exploration_result: "目标文件定义 Agent 之间共享的 TypedDict 状态结构。"
    relevant_files:
      - "code_agent/state.py"
  mock_output: |
    **审查通过**
    状态字段定义清晰，未发现明显逻辑或安全问题。
  expected:
    must_contain: ["审查通过"]
    must_not_contain: ["审查不通过"]

- name: "审查不通过-文件路径边界校验"
  input: "安全审查 code_agent/tools/file_tools.py，重点检查路径穿越和工作区边界校验。"
  context:
    exploration_result: "目标文件通过 _safe_path 计算绝对路径，并用于文件读写。"
    relevant_files:
      - "code_agent/tools/file_tools.py"
  mock_output: |
    **审查不通过**
    _safe_path 使用字符串 startswith 判断路径是否位于工作区内。若工作区为 /tmp/workspace，/tmp/workspace_evil/file 也会通过此前缀检查，存在路径穿越风险。应使用 pathlib.Path.relative_to 或 commonpath 做路径包含校验。
  expected:
    must_contain: ["审查不通过", "路径穿越"]
    must_not_contain: ["审查通过"]

- name: "审查不通过-Shell命令注入"
  input: "安全审查 code_agent/tools/shell_tools.py，重点检查 shell 命令拼接和白名单绕过风险。"
  context:
    exploration_result: "目标文件先检查命令前缀，再调用 subprocess.run 执行命令。"
    relevant_files:
      - "code_agent/tools/shell_tools.py"
  mock_output: |
    **审查不通过**
    bash 使用 shell=True 执行用户提供的命令，而前缀白名单允许命令后继续拼接 shell 语法，存在命令注入或白名单绕过风险。应避免 shell=True，使用参数列表执行并收紧命令校验。
  expected:
    must_contain: ["审查不通过", "shell=True"]
    must_not_contain: ["审查通过"]

- name: "审查不通过-工作目录异常处理"
  input: "审查 code_agent/project_context.py，重点检查工作目录不存在或路径不是目录时的异常处理。"
  context:
    exploration_result: "get_project_context 调用 os.listdir，并只捕获 PermissionError。"
    relevant_files:
      - "code_agent/project_context.py"
  mock_output: |
    **审查不通过**
    get_project_context 只捕获 PermissionError。工作目录不存在时，os.listdir 会抛出 FileNotFoundError；路径是文件时会抛出 NotADirectoryError，都会导致 Agent 初始化上下文失败。建议捕获 OSError 并返回默认上下文。
  expected:
    must_contain: ["审查不通过"]
    must_match: ["FileNotFoundError|文件不存在|NotADirectoryError"]
    must_not_contain: ["审查通过"]
